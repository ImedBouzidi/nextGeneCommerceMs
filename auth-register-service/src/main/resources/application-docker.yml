spring:
  application:
    name: auth-register-service
  config:
    activate:
      on-profile: docker
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: auth-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:buyme_users}
    username: ${DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # 🔑 Added Security Configuration from application-local.yml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/e-commerce

server:
  # 💡 Change 3: Set back to 8085 for consistency/microservice port (from your local setup)
  port: 8085
  servlet:
    context-path: /api # Add context-path from local config

keycloak:
  # 🔑 Added Keycloak Configuration from application-local.yml
  realm: e-commerce
  # 💡 Docker Change 4: Use the Keycloak service name
  auth-server-url: http://keycloak:8080
  resource: auth-service
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET}
  use-resource-role-mappings: true

eureka:
  client:
    enabled: true
    service-url:
      # 💡 Docker Change 5: Use the Eureka service name ('eureka-server')
      defaultZone: http://eureka-server:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${server.port}
    metadata-map:
      zone: docker

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics # Added 'metrics' back from your original setup
  endpoint:
    health:
      show-details: always # Added detail visibility back

app:
  # 🔑 Added App-Specific Configuration from application-local.yml
  upload:
    # 💡 Docker Change 6: Use a path suitable for Docker container volumes
    dir: /app/uploads
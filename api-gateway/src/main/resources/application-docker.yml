spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-service
          uri: lb://auth-register-service
          predicates:
            - Path=/auth/**
          filters:
            - name: RewritePath
              args:
                regexp: "/auth/(?<path>.*)"
                replacement: "/${path}"
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/product/**
          filters:
            - name: RewritePath
              args:
                regexp: "/product/(?<path>.*)"
                replacement: "/${path}"

        # Recommender service (Flask on port 5000) - static route since it's not a Eureka client
        - id: recommender-service
          uri: http://recommender-service:5000
          predicates:
            - Path=/recommendation/**
          filters:
            - StripPrefix=1

        # Customer segmentation service (Flask on port 5000) - static route since it's not a Eureka client
        - id: customer-segmentation-service
          uri: http://customer-segmentation-service:5000
          predicates:
            - Path=/segmentation/**
          filters:
            - StripPrefix=1

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka
    prefer-ip-address: true


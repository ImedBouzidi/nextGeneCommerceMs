spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/auth/**

        - id: catalogue-service-products
          uri: http://localhost:8084
          predicates:
            - Path=/api/products/**

        - id: catalogue-service-categories
          uri: http://localhost:8084
          predicates:
            - Path=/api/categories/**

        - id: catalogue-service-reviews
          uri: http://localhost:8084
          predicates:
            - Path=/api/reviews/**

        # Product images. catalogue-service serves them from /uploads/** (no /api
        # prefix, see WebConfig), so drop the /api segment before forwarding.
        - id: catalogue-service-uploads
          uri: http://localhost:8084
          predicates:
            - Path=/api/uploads/**
          filters:
            - StripPrefix=1

        - id: catalogue-service-cart
          uri: http://localhost:8086
          predicates:
            - Path=/api/cart/**

        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/payments/**
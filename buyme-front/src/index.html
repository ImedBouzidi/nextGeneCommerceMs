<!doctype html>
<html lang="en" data-theme="tech-dark">
<head>
  <meta charset="utf-8">
  <title>NextGenTech — Tech Store</title>
  <meta name="description" content="NextGenTech — Premium tech e-commerce. Shop the latest gadgets, electronics, and accessories.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Resolve the theme before first paint so there is no flash of the wrong one.
       Keep in sync with ThemeService (src/app/services/theme.service.ts). -->
  <script>
    (function () {
      try {
        var KEY = 'buyme.theme';
        var mode = null;
        try { var v = localStorage.getItem(KEY); if (v === 'light' || v === 'dark') { mode = v; } } catch (e) {}
        if (!mode && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          mode = 'light';
        }
        if (!mode) { mode = 'dark'; }
        var root = document.documentElement;
        root.setAttribute('data-theme', mode);
        root.style.colorScheme = mode;
      } catch (e) { /* fall back to the markup default */ }
    })();
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>

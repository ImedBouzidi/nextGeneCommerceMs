spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: catalogue-service

  # Product images are uploaded straight from the admin UI. Spring Boot's
  # defaults (1MB per file / 10MB per request) are far too small for camera
  # photos and made POST /api/products fail with "Maximum upload size exceeded".
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET}

app:
  upload:
    # Relative to the service working directory so it works on any machine.
    # Override with UPLOAD_DIR when running from Docker or a deployed jar.
    dir: ${UPLOAD_DIR:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,metrics,loggers  # Standard set; add 'beans' for deeper dev debugging
  endpoint:
    health:
      show-details: always  # Includes DB/JVM details

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG  # For REST endpoints
    org.springframework.security: DEBUG  # For JWT/auth
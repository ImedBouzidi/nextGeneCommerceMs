spring:
  application:
    name: catalogue-service
  config:
    activate:
      on-profile: docker
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # See application-local.yml: fail fast rather than blocking 60s on metadata.
      properties:
        max.block.ms: 3000
        delivery.timeout.ms: 3000
        request.timeout.ms: 2000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/e-commerce
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:e-com-catalogue-db}
    username: ${DB_USERNAME}
    password: ${CATALOGUE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8084

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${server.port}
    metadata-map:
      zone: docker

management:
  endpoints:
    web:
      exposure:
        include: health,info

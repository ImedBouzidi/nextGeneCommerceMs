server:
  port: 8086

spring:
  config:
    activate:
      on-profile: local
    import:
      - file:./.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:5432/${DB_NAME:e-com-cart-db}
    username: ${DB_USERNAME:imed}
    password: ${CART_DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: catalogue-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "tn.iteam.catalogueservice.dto.*"
    admin:
      properties:
        auto.create.topics.enable: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/e-commerce

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.kafka: DEBUG
    org.apache.kafka: DEBUG
    tn.iteam.cart-service: DEBUG

keycloak:
  auth-server-url: http://localhost:8080
  realm: e-commerce
  resource: cart-service
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET}
